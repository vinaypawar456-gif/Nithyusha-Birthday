<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:"Segoe UI",sans-serif;
    background:linear-gradient(135deg,#ffd6e7,#ffeef5,#ffd9e8);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:#4a2634;
}

/* Floating background */
.balloon{
    position:fixed;
    font-size:28px;
    animation:float 7s infinite ease-in-out;
    opacity:.65;
    pointer-events:none;
}

.b1{left:7%;top:12%;animation-delay:0s;}
.b2{right:8%;top:18%;animation-delay:2s;}
.b3{left:12%;bottom:15%;animation-delay:4s;}
.b4{right:12%;bottom:10%;animation-delay:1s;}

@keyframes float{
    0%,100%{transform:translateY(0) rotate(-5deg);}
    50%{transform:translateY(-25px) rotate(5deg);}
}

.container{
    width:100%;
    max-width:480px;
    padding:18px;
    position:relative;
    z-index:2;
}

.card{
    width:100%;
    min-height:620px;
    background:rgba(255,255,255,.88);
    border-radius:30px;
    padding:35px 25px;
    box-shadow:0 20px 60px rgba(180,70,110,.25);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
    overflow:hidden;
}

/* Opening */
.opening h1{
    font-size:30px;
    color:#d6336c;
    margin-bottom:15px;
}

.opening p{
    font-size:17px;
    line-height:1.6;
    margin-bottom:25px;
}

.gift{
    font-size:90px;
    cursor:pointer;
    user-select:none;
    transition:.3s;
    animation:giftBounce 1.6s infinite;
}

.gift:hover{
    transform:scale(1.12);
}

@keyframes giftBounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
}

.tap{
    margin-top:12px;
    color:#d6336c;
    font-weight:600;
    font-size:15px;
}

/* Pages */
.page{
    display:none;
    width:100%;
}

.page.active{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    animation:fadeIn .7s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.page h2{
    font-size:30px;
    color:#d6336c;
    margin-bottom:22px;
}

.page p{
    font-size:17px;
    line-height:1.75;
    margin-bottom:20px;
}

/* Highlight lines */
.highlight{
    color:#d6336c;
    font-weight:700;
}

.soft{
    color:#9c4665;
    font-weight:600;
}

.green{
    color:#16866b;
    font-weight:700;
}

.orange{
    color:#e47722;
    font-weight:700;
}

/* Navigation */
.nav{
    display:flex;
    justify-content:center;
    gap:10px;
    width:100%;
    margin-top:10px;
    flex-wrap:wrap;
}

button{
    border:none;
    padding:12px 18px;
    border-radius:25px;
    background:#d6336c;
    color:white;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 6px 15px rgba(214,51,108,.22);
    transition:.25s;
}

button:hover{
    transform:translateY(-2px);
    background:#bd285b;
}

/* PAGE 5 SPECIAL */
.page5{
    position:relative;
}

.page5::before{
    content:"";
    position:absolute;
    width:260px;
    height:260px;
    background:rgba(255,105,160,.12);
    border-radius:50%;
    top:-120px;
    right:-100px;
    filter:blur(5px);
}

.page5::after{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    background:rgba(255,190,215,.18);
    border-radius:50%;
    bottom:-120px;
    left:-100px;
}

.birthday-icon{
    font-size:52px;
    margin-bottom:8px;
    animation:pop 1.5s infinite ease-in-out;
}

@keyframes pop{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.08);}
}

.page5 h2{
    font-size:32px;
    margin-bottom:12px;
}

.birthday-main{
    font-size:20px !important;
    line-height:1.55 !important;
    font-weight:700;
    color:#8f3156;
    margin-bottom:14px !important;
}

.distance-text{
    font-size:16px !important;
    line-height:1.55 !important;
    margin-bottom:12px !important;
}

.status-card{
    width:100%;
    max-width:330px;
    margin:10px auto 15px;
    padding:14px 16px;
    border-radius:20px;
    background:linear-gradient(135deg,#fff0f6,#ffe0eb);
    border:1px solid rgba(214,51,108,.18);
    box-shadow:0 8px 25px rgba(214,51,108,.12);
    position:relative;
    z-index:2;
}

.status-title{
    font-size:13px;
    color:#9c4665;
    margin-bottom:4px;
    letter-spacing:.5px;
}

.status-active{
    font-size:21px;
    font-weight:800;
    color:#d6336c;
    margin-bottom:3px;
}

.expiry{
    font-size:13px;
    color:#777;
}

.punchline{
    font-size:15px !important;
    margin-bottom:12px !important;
}

    top:-30px;
    font-size:22px;
    pointer-events:none;
    z-index:10;
    animation:fall
