<head>

  <title>Happy Birthday Nithyusha 🎂</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #fff6fb 0%, #f5e9ff 45%, #e9ddff 100%);
      overflow: hidden;
      color: #34233f;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 22px;
      opacity: 1;
      transform: translateY(0) scale(1);
      transition: opacity 0.55s ease, transform 0.55s ease;
      z-index: 10;
    }

    .screen.hidden {
      display: none;
    }

    .screen.exit {
      opacity: 0;
      transform: translateY(-25px) scale(0.96);
    }
